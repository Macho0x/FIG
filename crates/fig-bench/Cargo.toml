[package]
name = "fig-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FIG protocol benchmarks"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fig-latency"
path = "src/bin/fig-latency.rs"

[[bin]]
name = "fig-load"
path = "src/bin/fig-load.rs"

[dependencies]
fig-core = { workspace = true }
fig-gateways = { workspace = true }
fig-exchange-sim = { path = "../fig-exchange-sim" }
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
serde = { workspace = true }
ciborium = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "frame_bench"
harness = false

[[bench]]
name = "transport_bench"
harness = false

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "gateway_bench"
harness = false

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "latency_bench"
harness = false

[features]
default = []
alloc = []

[[bench]]
name = "alloc_bench"
harness = false

[dev-dependencies]
