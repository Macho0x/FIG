[package]
name = "fig-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
fig-core = { path = ".." }
libfuzzer-sys = "0.4"

# Isolate from the FIG workspace so `cargo fuzz` can build this crate.
[workspace]
members = ["."]

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false
