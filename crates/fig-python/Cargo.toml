[package]
name = "fig-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for FIG (PyO3 reference SDK)"

[lib]
name = "fig_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
fig-core = { workspace = true }
fig-client = { path = "../fig-client" }
fig-ffi = { workspace = true }
fig-conformance = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }

[dev-dependencies]
fig-conformance = { workspace = true }
