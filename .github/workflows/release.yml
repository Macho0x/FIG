name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: |
          cargo build --release -p fig-exchange-sim
          cargo build --release -p fig-gateways --bin fig-gateway
          cargo build --release -p fig-cli
      - name: Generate changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --pretty=format:"- %s (%h)" "$RANGE"
          } > CHANGELOG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/fig-exchange-sim
            target/release/fig-gateway
            target/release/fig-cli
          body_path: CHANGELOG.md
          generate_release_notes: true
