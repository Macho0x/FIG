name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: |
          cargo build --release -p fig-exchange-sim
          cargo build --release -p fig-gateways --bin fig-gateway
          cargo build --release -p fig-cli
      - name: Generate changelog
        run: |
          git log --pretty=format:"- %s (%h)" "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)..HEAD" > CHANGELOG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/fig-exchange-sim
            target/release/fig-gateway
            target/release/fig
          body_path: CHANGELOG.md
          generate_release_notes: true
