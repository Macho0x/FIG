name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install OCaml smoke deps
        run: sudo apt-get update && sudo apt-get install -y ocaml ocaml-findlib libctypes-ocaml-dev
      - name: Build
        run: cargo build --workspace --all-features
      - name: Run tests
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test --workspace --all-features
      - name: Redis session round-trip
        run: cargo test -p fig-core --features session-redis round_trip_session -- --nocapture
      - name: Conformance vectors
        run: cargo run -p fig-conformance --bin fig-conformance
      - name: Python binding conformance
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test -p fig-python binding_conformance
      - name: FFI binding conformance
        run: cargo test -p fig-ffi binding_conformance
      - name: FFI stream merge handles
        run: cargo test -p fig-ffi --test stream_state
      - name: Binding compile smoke (Go/C++/C#/Java/TS/Zig/OCaml)
        run: |
          cargo build -p fig-ffi
          export LD_LIBRARY_PATH="$PWD/target/debug:${LD_LIBRARY_PATH:-}"
          (cd bindings/go/fig && go test -tags=conformance)
          cargo build -p fig-ffi --release
          bash bindings/cpp/smoke/run.sh
          export FIG_REPO_ROOT="$PWD"
          bash bindings/csharp/smoke/run.sh
          bash bindings/java/smoke/run.sh
          bash bindings/typescript/smoke/run.sh
          bash bindings/zig/smoke/run.sh
          bash bindings/ocaml/smoke/run.sh
      - name: Binding SBE hex parity
        run: |
          cargo build -p fig-ffi --release
          export LD_LIBRARY_PATH="$PWD/target/release:${LD_LIBRARY_PATH:-}"
          export FIG_REPO_ROOT="$PWD"
          (cd bindings/go/fig && go test -tags=conformance -run TestSbeHexViaFfi)
          bash bindings/cpp/smoke/sbe_hex.sh
          bash bindings/csharp/smoke/run.sh
      - name: FFI Tier 4 smoke tests
        run: cargo test -p fig-ffi --test advanced
      - name: Build fig-cli
        run: cargo build -p fig-cli --all-features
      - name: Run fig-cli integration tests
        run: cargo test -p fig-cli
      - name: Codegen drift check
        run: cargo run -p xtask -- codegen --check
      - name: Gateway catalog completeness
        run: cargo run -p xtask -- check-gateway
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Show coverage summary
        run: cargo llvm-cov --workspace --all-features --summary-only

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run codec benchmarks (smoke)
        run: cargo bench -p fig-bench --bench codec_bench -- --sample-size 10
      - name: Run frame benchmarks (smoke)
        run: cargo bench -p fig-bench --bench frame_bench -- --sample-size 10
      - name: Run transport benchmarks (smoke)
        run: cargo bench -p fig-bench --bench transport_bench -- tree_ping_pong_steady_state --sample-size 10
      - name: Run gateway comparison benchmarks (smoke)
        run: cargo bench -p fig-bench --bench gateway_bench -- protocol_comparison --sample-size 10
      - name: Run allocation benchmarks (smoke)
        run: cargo bench -p fig-bench --features alloc --bench alloc_bench -- --sample-size 10
      - name: Run tail-latency harness (smoke)
        run: FIG_LATENCY_ITERS=200 cargo run --release -p fig-bench --bin fig-latency
      - name: Run load harness (smoke)
        run: FIG_LOAD_SECS=3 cargo run --release -p fig-bench --bin fig-load
      - name: Build Go binding (smoke)
        run: |
          cargo build -p fig-ffi
          export LD_LIBRARY_PATH="$PWD/target/debug:${LD_LIBRARY_PATH:-}"
          (cd bindings/go/fig && go test -tags=conformance)

  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: cargo test --workspace --all-features --exclude fig-python

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz frame_decode
        working-directory: crates/fig-core
        run: cargo fuzz run frame_decode -- -max_total_time=30
