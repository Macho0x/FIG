name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-features
      - name: Run tests
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test --workspace --all-features
      - name: Conformance vectors
        run: cargo run -p fig-conformance --bin fig-conformance
      - name: Codegen drift check
        run: cargo run -p xtask -- codegen --check
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Show coverage summary
        run: cargo llvm-cov --workspace --all-features --summary-only

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run frame benchmarks (smoke)
        run: cargo bench -p fig-bench --bench frame_bench -- --sample-size 10
      - name: Run transport benchmarks (smoke)
        run: cargo bench -p fig-bench --bench transport_bench -- tree_ping_pong_round_trip --sample-size 10
      - name: Run gateway comparison benchmarks (smoke)
        run: cargo bench -p fig-bench --bench gateway_bench -- protocol_comparison --sample-size 10
      - name: Run allocation benchmarks (smoke)
        run: cargo bench -p fig-bench --features alloc --bench alloc_bench -- --sample-size 10

  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: cargo test --workspace --all-features
