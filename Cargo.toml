[workspace]
resolver = "2"
members = [
    "crates/fig-core",
    "crates/fig-gateways",
    "crates/fig-fsl",
    "crates/fig-exchange-sim",
    "crates/fig-cli",
    "crates/fig-client",
    "crates/fig-bench",
    "crates/fig-conformance",
    "crates/fig-ffi",
    "crates/fig-python",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Macho0x/fig"
homepage = "https://github.com/Macho0x/fig"
description = "FIG — Fast Interchange Gateway"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
# TREE transport
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
# Binary encoding
bytes = "1"
byteorder = "1"
# CBOR for extension metadata
ciborium = "0.2"
# Error handling
thiserror = "1"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4", features = ["derive"] }
# Misc
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
zstd = "0.13"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Internal crates
fig-core = { path = "crates/fig-core" }
fig-conformance = { path = "crates/fig-conformance" }
fig-gateways = { path = "crates/fig-gateways" }
fig-ffi = { path = "crates/fig-ffi" }
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

