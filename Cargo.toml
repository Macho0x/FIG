[workspace]
resolver = "2"
members = [
    "crates/unip-core",
    "crates/unip-usl",
    "crates/unip-exchange-sim",
    "crates/unip-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Macho0x/unip"
homepage = "https://github.com/Macho0x/unip"
description = "UNIP — Unified Network Interchange Protocol"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# QUIC transport
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
# Binary encoding
bytes = "1"
byteorder = "1"
# CBOR for extension metadata
ciborium = "0.2"
# Error handling
thiserror = "1"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4", features = ["derive"] }
# Misc
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
# Internal crates
unip-core = { path = "crates/unip-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
